# Center point for the search (Wallapop is geo-based). Oviedo: northern Spain.
[location]
latitude = 43.3614
longitude = -5.8494
# Max distance in km from the point above (Wallapop supports 400 = "all Spain").
distance_km = 300

# One [[searches]] block per model you want to track.
# `keywords`      = broad terms typed into Wallapop's search box (run + merged).
# `title_contains`= ALL must appear in the title (spacing/dashes ignored) to keep it.
# `title_excludes`= if ANY appears in the title, drop it.
# `name`          = stable slug label for this model's data.

# --- 600cc supersport (fully-faired sportbikes), ~2008, ~4000 € ------------------

[[searches]]
name = "suzuki-gsxr-600"
keywords = ["suzuki gsxr 600", "gsx-r 600", "gsxr600", "gsxr 600"]
min_price = 2500
max_price = 6500
title_contains = ["gsxr", "600"]           # "gsxr"+"600" => not the naked GSR/GSX-S, not 750/1000
title_excludes = ["750", "1000", "gsr", "gsxs", "bandit", "despiece", "desguace", "piezas"]

[[searches]]
name = "honda-cbr-600rr"
keywords = ["honda cbr 600rr", "cbr600rr", "cbr 600", "honda cbr 600"]
min_price = 2500
max_price = 6500
title_contains = ["cbr600"]                # catches 600RR and faired 600F; excludes CBR1000/650
title_excludes = ["hornet", "cb600", "1000", "650", "125", "despiece", "desguace", "piezas"]

[[searches]]
name = "kawasaki-zx6r"
keywords = ["kawasaki zx6r", "zx-6r", "ninja zx6r", "zx 6r", "zx6r 636"]
min_price = 2500
max_price = 6500
title_contains = ["zx6r"]                  # 599 & 636 both supersport; excludes ZX-10R, naked Z
title_excludes = ["zx10r", "zx-10", "z750", "z650", "despiece", "desguace", "piezas"]

[[searches]]
name = "yamaha-r6"
keywords = ["yamaha r6", "yzf r6", "yamaha yzf-r6", "r6"]
min_price = 2500
max_price = 6500
# Require brand + "r6" so we don't grab a GSX-R600 ("...r600...") or a CBR600.
title_contains = ["yamaha", "r6"]
title_excludes = ["r1", "mt", "fz6", "fazer", "xj6", "despiece", "desguace", "piezas"]

[[searches]]
name = "triumph-daytona-675"
keywords = ["triumph daytona 675", "daytona 675", "triumph daytona"]
min_price = 2500
max_price = 6500
title_contains = ["daytona", "675"]        # the supersport 675; excludes the bigger 955i
title_excludes = ["955", "900", "1200", "street triple", "speed triple", "despiece", "desguace", "piezas"]

